<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-size: 14px; }
  .panel { background: rgba(10, 13, 20, 0.82); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(2px); }
  /* mission card — top left */
  #mission-card { position: absolute; top: 14px; left: 14px; width: 300px; border-top: 4px solid #f2c14e; }
  .mc-chapter { color: #f2c14e; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .mc-stage { display: inline-block; background: #f2c14e; color: #111; font-size: 11px; font-weight: 800;
    padding: 1px 7px; border-radius: 4px; margin: 5px 0 2px; }
  .mc-name { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
  .mc-bar { height: 6px; background: rgba(255,255,255,0.18); border-radius: 3px; margin: 6px 0; overflow: hidden; }
  #mc-fill { height: 100%; width: 33%; background: #f2c14e; border-radius: 3px; }
  .mc-text { font-size: 13px; color: #e8e2d4; }
  .mc-next { font-size: 11px; color: #9fb0c0; margin-top: 4px; }
  /* police panel — left, under mission card */
  #police-panel { position: absolute; top: 196px; left: 14px; width: 300px; }
  .pp-head { display: flex; justify-content: space-between; color: #ff8a7a; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
  .pp-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; }
  .pp-name { font-weight: 700; width: 76px; }
  .pp-role { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; flex: 1; text-align: center; margin: 0 8px; }
  .pp-role.RAMMING { background: #e23b2e; } .pp-role.PURSUIT { background: #f2c14e; color: #111; }
  .pp-role.FLANKING { background: #3a7dff; }
  .pp-dist { width: 44px; text-align: right; color: #ffd98a; }
  .pp-foot { font-size: 11px; color: #9fb0c0; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 5px; margin-top: 4px; }
  /* district + minimap — bottom left */
  #district-card { position: absolute; left: 14px; bottom: 246px; width: 200px; }
  .dc-name { font-size: 19px; font-weight: 800; }
  .dc-sub { font-size: 12px; color: #c8d2de; }
  .dc-meter { font-size: 11px; margin-top: 5px; }
  .dc-bar { height: 5px; background: rgba(255,255,255,0.18); border-radius: 3px; margin-top: 2px; overflow: hidden; }
  #dc-fill { height: 100%; width: 58%; background: #3ddc5a; }
  #minimap { position: absolute; left: 14px; bottom: 84px; width: 220px; height: 220px;
    border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; background: rgba(8,14,22,0.9); }
  #vitals { position: absolute; left: 14px; bottom: 14px; width: 210px; padding: 8px 10px; }
  .vit-row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; margin: 3px 0; }
  .vit-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; }
  #vit-hp { height: 100%; width: 100%; background: #3ddc5a; }
  #vit-ar { height: 100%; width: 40%; background: #5aa9ff; }
  .vit-row b { width: 26px; text-align: right; }
  /* cash + wanted — top right */
  #cash-box { position: absolute; top: 14px; right: 14px; text-align: right; }
  .cb-time { font-size: 12px; color: #c8d2de; }
  .cb-cash { font-size: 34px; font-weight: 800; color: #7dff9a; line-height: 1.05; }
  .cb-stars { font-size: 20px; color: #f2c14e; letter-spacing: 3px; }
  .cb-rank { font-size: 12px; color: #f2c14e; font-weight: 700; margin-top: 2px; }
  .cb-xpbar { height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 3px; overflow: hidden; }
  #cb-xpfill { height: 100%; width: 78%; background: #5aa9ff; }
  /* weapons — right, under cash */
  #weapons { position: absolute; top: 148px; right: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 236px; }
  .wpn { background: rgba(10,13,20,0.82); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
    padding: 6px 8px; position: relative; min-height: 44px; }
  .wpn.active { border-color: #f2c14e; box-shadow: 0 0 0 1px #f2c14e; }
  .wpn-num { position: absolute; top: 3px; right: 7px; font-size: 10px; color: #9fb0c0;
    border: 1px solid #9fb0c0; border-radius: 3px; padding: 0 4px; }
  .wpn-ic { font-size: 18px; }
  .wpn-name { font-size: 11px; font-weight: 700; }
  .wpn-ammo { position: absolute; bottom: 4px; right: 8px; font-size: 12px; color: #ffd98a; font-weight: 700; }
  /* crew cards — right */
  #crew { position: absolute; top: 268px; right: 14px; width: 236px; display: flex; flex-direction: column; gap: 6px; }
  .crew-card { background: rgba(10,13,20,0.82); border: 1px solid rgba(255,255,255,0.14); border-left: 3px solid #5aa9ff;
    border-radius: 8px; padding: 7px 9px; display: flex; align-items: center; gap: 9px; }
  .crew-face { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0; }
  .crew-body { flex: 1; } .crew-body b { display: block; font-size: 13px; }
  .crew-body span { font-size: 11px; color: #c8d2de; display: block; }
  .crew-body em { font-size: 10px; color: #9fb0c0; font-style: normal; }
  .crew-key { border: 1px solid #9fb0c0; border-radius: 4px; padding: 2px 6px; font-size: 12px; font-weight: 700; }
  /* dialogue — bottom centre */
  #dialogue { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 480px;
    display: flex; gap: 12px; align-items: center; border-left: 4px solid #f2c14e; }
  .dlg-face { width: 46px; height: 46px; border-radius: 8px; background: #5aa9ff; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
  .dlg-who { font-size: 13px; } .dlg-who span { color: #5aa9ff; font-weight: 800; }
  .dlg-who i { color: #9fb0c0; font-style: normal; font-size: 11px; }
  .dlg-text { font-size: 13px; color: #e8e2d4; margin-top: 2px; }
  /* speed — bottom right */
  #speed-box { position: absolute; bottom: 16px; right: 14px; text-align: right; }
  .sp-num { font-size: 46px; font-weight: 800; line-height: 0.95; }
  .sp-num .sp-unit { font-size: 15px; color: #f2c14e; margin-left: 4px; }
  .sp-car { color: #5aa9ff; font-weight: 800; font-size: 15px; }
  .sp-tune { font-size: 11px; color: #c8d2de; }
  .sp-cond { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 11px; margin-top: 3px; }
  .sp-bar { width: 90px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
  #sp-condfill { height: 100%; width: 88%; background: #f2c14e; }
  #radio-line { position: absolute; bottom: 116px; right: 14px; font-size: 12px; color: #e8e2d4;
    background: rgba(10,13,20,0.75); padding: 4px 10px; border-radius: 14px; }
  #hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.75);
    background: rgba(10,13,20,0.6); padding: 3px 10px; border-radius: 12px; }
  #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: #f2c14e; color: #111;
    font-weight: 800; padding: 8px 18px; border-radius: 8px; opacity: 0; transition: opacity 0.25s; font-size: 15px; }
  #toast.show { opacity: 1; }
  /* title screen (only when opened without a shot preset) */
  #title { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: linear-gradient(180deg, rgba(20,10,5,0.55), rgba(20,10,5,0.85)); z-index: 5; }
  #title h1 { font-size: 64px; margin: 0; letter-spacing: 4px; color: #f2c14e; text-shadow: 0 4px 0 #7a2e12; }
  #title p { font-size: 17px; color: #e8e2d4; max-width: 560px; text-align: center; }
  #play-btn { pointer-events: auto; cursor: pointer; background: #f2c14e; color: #111; border: none;
    font-size: 20px; font-weight: 800; padding: 14px 44px; border-radius: 10px; margin-top: 12px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solara Bay: drive the Strand, lose the SBP, run the eight story missions"></canvas>
<div id="hud"></div>
<div id="title">
  <h1>SOLARA BAY</h1>
  <p>An open-world crime game. Eight story missions across the bay — drive the Strand,
  dodge the SBP, run the crew. Keyboard + mouse. Your save is kept in this browser.</p>
  <button id="play-btn">▶ &nbsp;PLAY</button>
  <p style="font-size:13px;color:#9fb0c0">WASD drive · E enter / exit car · SPACE brake · M mission · 1–4 weapons · Z / X / C crew abilities</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { boot } from './src/main.js';
  boot();
</script>
</body>
</html>
